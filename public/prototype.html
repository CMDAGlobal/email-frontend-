<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch: email platform prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface2:#f8f9fb; --ink:#0f1a2c; --ink2:#46536a; --mute:#8390a4;
  --line:#e2e6ee; --line2:#eef0f5; --side:#0d1730; --side2:#16224a; --side-ink:#b9c3dc;
  --blue:#2a56d9; --blue-soft:#e8eefd; --red:#d6372e; --red-soft:#fdeceb;
  --green:#14935f; --green-soft:#e3f5ec; --amber:#b87a07; --amber-soft:#fcf1d9; --grey-soft:#eceff4;
  --shadow:0 12px 40px rgba(13,23,48,.18);
  --display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;
}
[data-theme="dark"]{
  --bg:#0a1122; --surface:#111b33; --surface2:#0e1730; --ink:#e9eefb; --ink2:#a9b6d0; --mute:#71809f;
  --line:#1f2c4d; --line2:#18233f; --side:#070d1d; --side2:#111b36; --side-ink:#9aa8c8;
  --blue:#6f93ff; --blue-soft:#18284f; --red:#ff6b61; --red-soft:#3a1d22;
  --green:#3fcf94; --green-soft:#10312a; --amber:#f0b542; --amber-soft:#35290f; --grey-soft:#1a2644;
  --shadow:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:400 14px/1.5 var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:0 0 16px}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 18px;color:#fff;font:700 21px var(--display);letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:8px;background:#fff;display:grid;place-items:center}
.stripe{height:5px;background:repeating-linear-gradient(135deg,var(--red) 0 12px,transparent 12px 20px,#4a74f0 20px 32px,transparent 32px 40px)}
.nav{padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:var(--side-ink);font-weight:500;position:relative;transition:background .15s,color .15s}
.nav a:hover{background:var(--side2);color:#fff}
.nav a.on{background:var(--side2);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--red)}
.nav .sep{height:1px;background:var(--side2);margin:10px 8px}
.nav small{font-size:12px;color:#6e7ca3;padding:4px 12px}
.sesbox{margin:0 16px;padding:14px;border-radius:10px;background:var(--side2)}
.sesbox b{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(20,147,95,.25)}
.bar{height:6px;border-radius:6px;background:var(--grey-soft);overflow:hidden}
.sesbox .bar{background:#0d1730;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--blue)}
.sesbox .bar i{background:#6f93ff}
.sesbox span{font-size:12px;color:#8b99bd}

.main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 36px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--mute)}
.search input{border:0;background:none;outline:0;flex:1;color:var(--ink)}
.kbd{font:500 11px var(--mono);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--mute)}
.top .sp{flex:1}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.iconbtn:hover{color:var(--ink);border-color:var(--mute)}
.burger{display:none}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--body);color:#fff;flex:none}
.content{padding:30px 36px 80px;max-width:1280px}

/* type + page header */
h1{font:700 30px/1.15 var(--display);letter-spacing:-.02em}
h2{font:700 18px/1.25 var(--display);letter-spacing:-.01em}
h3{font:600 14px var(--body)}
.muted{color:var(--mute)} .ink2{color:var(--ink2)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.ph p{color:var(--ink2);margin-top:6px}
.acts{display:flex;gap:10px;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;transition:transform .12s,border-color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
[data-theme="dark"] .btn.primary{color:#07102a}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:600;font-size:13px}
.field .hint{font-size:12px;color:var(--mute)}
.inp,select.inp,textarea.inp{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);outline:0;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.chk{accent-color:var(--blue);width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--surface)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow:auto}
.tabs a{padding:10px 0;color:var(--ink2);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-color:var(--red)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--grey-soft);color:var(--ink2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.tag{display:inline-block;padding:1px 9px;border-radius:6px;font-size:12px;font-weight:500;background:var(--grey-soft);color:var(--ink2);margin-right:4px}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel.pad{padding:22px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px 0}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.g2e{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:20px}
.strip>div{padding:20px 22px;border-left:1px solid var(--line)}
.strip>div:first-child{border-left:0}
.strip .v{font:700 29px/1.1 var(--display);letter-spacing:-.02em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.strip .l{color:var(--ink2);font-weight:500}
.up{color:var(--green);font-weight:600;font-size:12.5px}.down{color:var(--red);font-weight:600;font-size:12.5px}

/* tables */
.tw{overflow:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:13px;color:var(--mute);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface2)}
tr[data-drawer]{cursor:pointer}
td.r,th.r{text-align:right}
.who{display:flex;align-items:center;gap:12px}
.who b{display:block;font-weight:600}
.who span{color:var(--mute);font-size:13px}
.tbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbar .search{max-width:300px;background:var(--surface2)}
.mini{width:90px}
.score{display:flex;align-items:center;gap:10px}
.score .bar{width:64px}

/* drawer */
.veil{position:fixed;inset:0;background:rgba(7,13,29,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:51;transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);overflow:auto}
body.dopen .veil{opacity:1;pointer-events:auto}
body.dopen .drawer{transform:none}
.dr-h{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.dr-b{padding:24px}
.tl{list-style:none;position:relative;margin-top:8px}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl li{display:flex;gap:14px;padding:9px 0;position:relative}
.tl .pt{width:23px;height:23px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--blue);flex:none}
.tl small{color:var(--mute);display:block}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;display:flex;gap:10px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* dashboard bits */
.stamp{color:var(--blue);display:block;margin:0 auto}
.checks li{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}
.checks li:first-child{border-top:0}
.feed li{list-style:none;display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line2)}
.feed li:first-child{border-top:0}
.feed .t{color:var(--mute);font-size:12.5px}

/* rule builder */
.rule{display:grid;grid-template-columns:1.2fr 1fr 1.3fr auto;gap:10px;margin-bottom:10px;align-items:center}
.group{border:1px dashed var(--line);border-radius:12px;padding:16px;background:var(--surface2);margin-bottom:12px}
.join{display:flex;align-items:center;gap:12px;margin:2px 0 12px;color:var(--mute);font-weight:600}
.join::before,.join::after{content:"";flex:1;height:1px;background:var(--line)}
.bigcount{font:700 54px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* wizard */
.steps{display:flex;margin-bottom:28px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:auto}
.steps a{flex:1;display:flex;align-items:center;gap:10px;padding:14px 18px;color:var(--mute);font-weight:600;white-space:nowrap;border-left:1px solid var(--line)}
.steps a:first-child{border-left:0}
.steps .n{width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:12px}
.steps a.on{color:var(--ink);background:var(--surface2)}
.steps a.on .n{background:var(--red);border-color:var(--red);color:#fff}
.steps a.done{color:var(--green)}
.steps a.done .n{background:var(--green);border-color:var(--green);color:#fff}
.opt{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.opt b{display:block}
.opt .cnt{margin-left:auto;font-weight:600}
.inbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.inbox .row{display:grid;grid-template-columns:auto 150px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2);align-items:center;color:var(--mute)}
.inbox .row.me{background:var(--blue-soft);color:var(--ink)}
.inbox .row .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox .row.me .s b{font-weight:600}
.wizfoot{display:flex;justify-content:space-between;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.tpl{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--surface);transition:border-color .15s}
.tpl:hover,.tpl.on{border-color:var(--blue)}
.tpl .th{height:130px;border-radius:8px;background:var(--surface2);border:1px solid var(--line2);padding:12px;display:flex;flex-direction:column;gap:7px}
.tpl .th i{display:block;height:7px;border-radius:4px;background:var(--line)}
.tpl .th i.h{height:34px;background:var(--blue-soft)}
.tpl .th i.b{width:38%;height:11px;background:var(--red);opacity:.8}
.tpl b{display:block;margin-top:10px;font-weight:600}

/* editor */
.ed{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;min-height:700px}
.ed>div{padding:20px}
.ed .l{border-right:1px solid var(--line)}
.ed .rr{border-left:1px solid var(--line)}
.ed .cv{background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:14px;overflow:auto}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}
.blocks div{border:1px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:grab;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface2)}
.blocks div:hover{border-color:var(--blue);color:var(--blue)}
.mail{width:620px;max-width:100%;background:#fff;color:#1b2333;border-radius:4px;box-shadow:0 2px 24px rgba(13,23,48,.12);transition:width .25s}
.mail .hd{padding:26px 36px;border-bottom:1px solid #eceff4;font:700 19px var(--display)}
.mail .hero{padding:44px 36px;background:#14223f;color:#fff}
.mail .hero h4{font:700 32px/1.1 var(--display);letter-spacing:-.02em;margin-bottom:12px}
.mail .bd{padding:30px 36px;line-height:1.65;color:#37425a}
.mail .bd p+p{margin-top:14px}
.mail .cta{display:inline-block;margin-top:22px;padding:13px 26px;background:#d6372e;color:#fff;font-weight:600;border-radius:6px;outline:2px solid #2a56d9;outline-offset:4px;position:relative}
.mail .cta::after{content:"Button";position:absolute;top:-26px;left:-2px;background:#2a56d9;color:#fff;font:600 11px var(--body);padding:1px 8px;border-radius:4px 4px 0 0}
.mail .ft{padding:24px 36px;background:#f4f6fa;font-size:12px;color:#7a869c;text-align:center}
.mail .ft u{color:#2a56d9}
.merge{font:500 12px var(--mono);background:var(--blue-soft);color:var(--blue);padding:1px 7px;border-radius:5px}
.swatches{display:flex;gap:8px}
.swatches i{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatches i.on{box-shadow:0 0 0 2px var(--ink)}

/* workflow */
.canvas{position:relative;height:700px;min-width:900px;background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:22px 22px}
.cwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.node{position:absolute;width:220px;min-height:76px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 2px 0 var(--line);cursor:pointer;transition:border-color .15s,transform .15s}
.node:hover{border-color:var(--blue);transform:translateY(-2px)}
.node small{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px;margin-bottom:4px}
.node.trig{border-color:var(--blue)} .node.trig small{color:var(--blue)}
.node.mailn small{color:var(--red)} .node.wait small{color:var(--amber)} .node.cond small{color:var(--green)}
.node p{font-weight:600;line-height:1.3}
.node em{font-style:normal;color:var(--mute);font-size:12.5px;display:block;margin-top:2px}
.lbl{position:absolute;font-size:12px;font-weight:600;background:var(--surface);padding:0 8px;border:1px solid var(--line);border-radius:999px}
.canvas svg{position:absolute;inset:0;pointer-events:none}
.canvas path{fill:none;stroke:var(--mute);stroke-width:1.5}

/* misc */
.code{font:13px/1.6 var(--mono);background:#0d1730;color:#cdd8f3;border-radius:10px;padding:16px 18px;overflow:auto;white-space:pre}
.code .k{color:#8fb0ff}.code .s{color:#8fe0b4}
.heat{display:grid;grid-template-columns:44px repeat(12,1fr);gap:4px;align-items:center;font-size:12px;color:var(--mute)}
.heat i{height:26px;border-radius:5px;background:var(--blue)}
.pbar{display:flex;align-items:center;gap:12px}
.pbar .bar{flex:1}
.dns .mono{font:12.5px var(--mono);color:var(--ink2);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:34px;text-align:center;color:var(--ink2);background:var(--surface2)}
.sub{display:flex;flex-direction:column;gap:2px}
.sub a{padding:8px 12px;border-radius:8px;font-weight:600;color:var(--ink2)}
.sub a.on{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.thumb{height:150px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);padding:14px;display:flex;flex-direction:column;gap:8px}
.thumb i{display:block;height:8px;border-radius:4px;background:var(--line)}
.thumb i.h{height:44px;background:var(--blue-soft)}
.thumb i.b{width:34%;height:12px;background:var(--red);opacity:.85}

/* public */
.pub{min-height:100vh;display:grid;place-items:center;padding:30px;background:var(--bg)}
.env{width:min(560px,100%);background:var(--surface);border-radius:6px;padding:12px;background-image:repeating-linear-gradient(135deg,var(--red) 0 14px,var(--surface) 14px 24px,#4a74f0 24px 38px,var(--surface) 38px 48px)}
.env>div{background:var(--surface);padding:38px 38px 32px;border-radius:2px}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .l{background:var(--side);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .l .stamp{position:absolute;right:-70px;bottom:-60px;width:460px;color:#4a74f0;opacity:.35;transform:rotate(-12deg)}
.login .r{display:grid;place-items:center;padding:40px;background:var(--bg)}

@media (max-width:1100px){.strip{grid-template-columns:repeat(2,1fr)}.strip>div{border-top:1px solid var(--line)}.g2,.g3,.g2e{grid-template-columns:1fr}.ed{grid-template-columns:1fr}.ed .l,.ed .rr{border:0;border-bottom:1px solid var(--line)}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:60;width:260px;transform:translateX(-100%);transition:transform .25s}
  body.nav-open .side{transform:none}
  .burger{display:grid}
  .top,.content{padding-left:18px;padding-right:18px}

function areaChart(){
  const W=720,H=250,L=44,B=28,T=10,n=30;
  const sent=[...Array(n)].map((_,i)=>2300+900*Math.sin(i/3.2)+i*22-(i%7===0?900:0));

  const max=4000, x=i=>L+i*(W-L-8)/(n-1), y=v=>T+(H-T-B)*(1-v/max);
  const ps=sent.map((v,i)=>[x(i),y(v)]), po=open.map((v,i)=>[x(i),y(v)]);
  let g='';for(let k=0;k<=4;k++){const v=k*1000,yy=y(v);g+=`<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line2)"/><text x="${L-10}" y="${yy+4}" text-anchor="end" fill="var(--mute)" font-size="11">${k?k+'k':'0'}</text>`}

  if(sub==='team') b=`<div class="panel"><div class="panel-h"><h2>Team</h2><button class="btn sm primary" data-toast="Invite sent">${I('plus',14)}Invite person</button></div><div class="tw" style="margin-top:10px"><table><thead><tr><th>Person</th><th>Role</th><th>Last active</th></tr></thead><tbody>
   ${[['Ada Nwosu','ada@northwind.co','Admin','Now'],['Tobi Alade','tobi@northwind.co','Marketer','2 hours ago'],['Mira Chen','mira@northwind.co','Viewer','Yesterday']].map(m=>`<tr><td><div class="who">${av(m[0])}<div><b>${m[0]}</b><span>${m[1]}</span></div></div></td><td><select class="inp" style="width:auto"><option ${m[2]==='Admin'?'selected':''}>Admin</option><option ${m[2]==='Marketer'?'selected':''}>Marketer</option><option ${m[2]==='Viewer'?'selected':''}>Viewer</option></select></td><td class="muted">${m[3]}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(sub==='migration') b=`<div class="stack"><div class="panel pad"><h2>Move your Mautic data</h2><p class="ink2" style="margin:4px 0 16px">Bring over contacts, tags, segments and email stats. Nothing is deleted from Mautic.</p><div class="drop">${I('download',26)}<p style="margin-top:8px"><b>Drop your Mautic export here</b></p><p class="muted">CSV or JSON, up to 200 MB</p></div></div>
   <div class="panel"><div class="panel-h"><h2>Match fields</h2></div><div class="tw" style="margin-top:10px"><table><thead><tr><th>Mautic field</th><th>Dispatch field</th><th></th></tr></thead><tbody>${[['email','Email'],['firstname','First name'],['company','Company'],['points','Lead score'],['tags','Tags']].map(f=>`<tr><td class="num">${f[0]}</td><td><select class="inp" style="max-width:240px"><option>${f[1]}</option></select></td><td>${I('check',16)}</td></tr>`).join('')}</tbody></table></div></div>
   <div><button class="btn primary" data-toast="Import started">Start import</button></div></div>`;
  if(sub==='tracking') b=`<div class="panel pad">${[['Track opens','Adds a tiny image to measure opens.',1],['Track clicks','Rewrites links so clicks can be counted.',1],['Use a custom tracking domain','links.mail.northwind.co keeps links on your own brand.',1],['One-click unsubscribe header','Required by Gmail and Yahoo for bulk senders.',1]].map(t=>`<label style="display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-top:1px solid var(--line2);cursor:pointer"><span><b style="display:block">${t[0]}</b><span class="muted">${t[1]}</span></span><input type="checkbox" class="chk" checked></label>`).join('')}</div>`;
  return shell('settings',`${ph('Settings','Sending, people and compliance for Northwind Studio.')}<div style="display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px" class="g2e">${S}<div>${b}</div></div>`);
};

V.unsubscribe=()=>`<div class="pub"><div class="env"><div>
 <div class="brand" style="color:var(--ink);padding:0 0 22px"><span class="mark" style="background:var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3z"/><path d="M3 7l9 6 9-6"/></svg></span>Northwind</div>
 <h1 style="font-size:26px">Update your email preferences</h1><p class="ink2" style="margin:8px 0 22px">Changes apply to <b>adaeze@lagoscraft.co</b>.</p>
 ${[['Monthly digest','What we shipped, once a month',1],['Product updates','Big releases only',1],['Webinar invites','About one a quarter',0]].map(o=>`<label class="opt"><input type="checkbox" class="chk" ${o[2]?'checked':''}><div><b>${o[0]}</b><span class="muted">${o[1]}</span></div></label>`).join('')}
 <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="btn primary" data-toast="Preferences saved">Save preferences</button><button class="btn" data-toast="You are unsubscribed from everything">Unsubscribe from all</button></div>
 <p class="muted" style="margin-top:18px;font-size:12.5px">Northwind Studio, 14 Marina Road, Lagos. <a href="#/dashboard" style="text-decoration:underline">Back to the prototype</a></p></div></div></div>`;

V.login=()=>`<div class="login"><div class="l"><div class="brand" style="padding:0"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0d1730" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3z"/><path d="M3 7l9 6 9-6"/></svg></span>Dispatch</div>
 <div style="max-width:440px;position:relative;z-index:1"><h1 style="font-size:44px;color:#fff;margin-bottom:14px">Send email you own, through infrastructure you control.</h1><p style="color:var(--side-ink);font-size:16px">Campaigns, automations and transactional email on your own server, delivered by Amazon SES.</p></div>${stamp('stamp',460)}</div>
 <div class="r"><div style="width:min(380px,100%)"><h1 style="font-size:28px">Sign in</h1><p class="ink2" style="margin:6px 0 24px">Welcome back to Dispatch.</p>
 <div class="field"><label>Email</label><input class="inp" value="ada@northwind.co"></div><div class="field"><label>Password</label><input class="inp" type="password" value="password123"><a class="hint" style="text-decoration:underline" href="#/login">Forgot your password?</a></div>
 <button class="btn primary" style="width:100%;justify-content:center" data-go="#/dashboard">Sign in</button></div></div></div>`;

/* ---------- drawer + router ---------- */
const drawer=document.getElementById('drawer');
function openDrawer(key){
  const [k,i]=key.split(':');let h='';
  if(k==='c'){const p=PEOPLE[i];h=`<div class="dr-h"><h2>Contact</h2><button class="iconbtn" data-close aria-label="Close">${I('x',16)}</button></div><div class="dr-b">
   <div class="who" style="margin-bottom:18px">${av(p[0],54)}<div><h2 style="font-size:22px">${p[0]}</h2><span>${p[1]}</span></div></div>
   <div style="margin-bottom:18px">${pill(p[4])}</div>
   <div class="strip" style="grid-template-columns:repeat(3,1fr);margin-bottom:22px"><div><div class="l">Lead score</div><div class="v" style="font-size:24px">${p[5]}</div></div><div><div class="l">Opens</div><div class="v" style="font-size:24px">${Math.round(p[5]/4)}</div></div><div><div class="l">Clicks</div><div class="v" style="font-size:24px">${Math.round(p[5]/12)}</div></div></div>
   <h3>Lists</h3><p style="margin:6px 0 16px">${tags(p[3])}</p><h3>Tags</h3><p style="margin:6px 0 20px">${tags(p[2])}</p>
   <h3>Activity</h3><ul class="tl"><li><span class="pt">${I('click',13)}</span><div>Clicked <b>Read the full update</b><small>${p[6]}</small></div></li><li><span class="pt">${I('eye',13)}</span><div>Opened <b>October product digest</b><small>${p[6]}</small></div></li><li><span class="pt">${I('mail',13)}</span><div>Received <b>October product digest</b><small>Oct 24</small></div></li><li><span class="pt">${I('form',13)}</span><div>Submitted <b>Footer signup</b><small>Sep 2</small></div></li></ul>
   <div style="display:flex;gap:10px;margin-top:22px"><button class="btn" data-toast="Contact saved">Edit contact</button><button class="btn danger" data-toast="Address suppressed">Suppress</button></div></div>`}
  if(k==='l'){const l=LOGS[i];h=`<div class="dr-h"><h2>Message</h2><button class="iconbtn" data-close aria-label="Close">${I('x',16)}</button></div><div class="dr-b">
   <h2 style="font-size:22px;margin-bottom:6px">${l[0]}</h2><p class="ink2" style="margin-bottom:14px">To ${l[1]}</p>${pill(l[2])}<span class="tag" style="margin-left:8px">${l[3]}</span>
   <h3 style="margin:24px 0 4px">Delivery timeline</h3><ul class="tl"><li><span class="pt">${I('check',13)}</span><div>Queued<small>${l[4]}, 0.0s</small></div></li><li><span class="pt">${I('send',13)}</span><div>Accepted by Amazon SES<small>${l[4]}, 0.3s</small></div></li><li><span class="pt">${I('mail',13)}</span><div>${l[2]==='Bounced'?'Rejected by recipient server':'Delivered to inbox'}<small>${l[4]}, 1.8s</small></div></li></ul>
   <h3 style="margin:24px 0 8px">Headers</h3><div class="code">Message-ID: &lt;0102018b...@eu-west-1.amazonses.com&gt;
From: Northwind &lt;hello@mail.northwind.co&gt;
DKIM-Signature: <span class="s">pass</span>
List-Unsubscribe: <span class="k">&lt;https://mail.northwind.co/u/..&gt;</span></div>
   <div style="margin-top:20px"><button class="btn" data-toast="Message queued again">Resend</button></div></div>`}
  drawer.innerHTML=h;document.body.classList.add('dopen');
}
const closeDrawer=()=>document.body.classList.remove('dopen');
let tt;function toast(m){const t=document.getElementById('toast');t.innerHTML=I('check',16)+m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

function render(){
  closeDrawer();document.body.classList.remove('nav-open');
  const p=(location.hash.replace(/^#\/?/,'')||'dashboard').split('/');
  let html;
  if(p[0]==='campaigns'&&p[1]==='new') html=V.wizard(p[2]||1);
  else if(V[p[0]]) html=V[p[0]](p[1]); else html=V.dashboard();
  document.getElementById('root').innerHTML=html;window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-close],[data-go],[data-drawer],[data-toast],[data-theme-toggle],[data-nav],[data-seg] button,[data-swap] button,[data-width] button,[data-pick],.chip,.swatches i');
  if(!t)return;
  if(t.hasAttribute('data-close'))closeDrawer();
  if(t.dataset.toast)toast(t.dataset.toast);
  if(t.dataset.go){if(location.hash!==t.dataset.go)location.hash=t.dataset.go;return}
  if(t.dataset.drawer)openDrawer(t.dataset.drawer);
  if(t.hasAttribute('data-theme-toggle')){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'}
  if(t.hasAttribute('data-nav'))document.body.classList.toggle('nav-open');
  if(t.matches('[data-seg] button,[data-swap] button,[data-width] button')){
    t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));
    if(t.dataset.t){document.querySelectorAll('.code[id^="s"]').forEach(c=>c.hidden=c.id!==t.dataset.t)}
    if(t.dataset.w){document.getElementById('mail').style.width=t.dataset.w+'px'}
  }
  if(t.matches('.chip')){t.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===t))}
  if(t.matches('.swatches i')){t.parentElement.querySelectorAll('i').forEach(c=>c.classList.toggle('on',c===t))}
  if(t.matches('[data-pick]')){t.parentElement.querySelectorAll('.tpl').forEach(c=>c.classList.toggle('on',c===t))}
});
document.addEventListener('input',e=>{
  const b=e.target.dataset&&e.target.dataset.bind;
  if(b)document.querySelectorAll(`[data-show="${b}"]`).forEach(n=>n.textContent=e.target.value);
});
document.addEventListener('change',e=>{
  if(e.target.classList.contains('aud')){let s=0;document.querySelectorAll('.aud:checked').forEach(c=>s+=+c.dataset.count);document.getElementById('aud-total').textContent=s.toLocaleString('en-US')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark';
render();
</script>
</body>
</html>
